[bindings]

[hotkeys]
toggleState=F1
exitApp=F3
moveUp=w
moveLeft=a
moveDown=s
moveRight=d
executeStep=Enter

[clickcoords]

[hudconfig]

[pathconfig]

[node:root]
label = Home
children = copy,create,save

[node:copy]
label = Copy
parent = root
children = basic,advanced

[node:basic]
label = Basic
parent = copy

[node:advanced]
label = Advanced
parent = copy
steps = "Step1,Step2,Step3,Step4"

[node:create]
label = Create
parent = root
children = file,folder

[node:file]
label = File
parent = create

[node:folder]
label = Folder
parent = create

[node:save]
label = Save
parent = root